name = "cds-kb-usage-collector"
main = "src/index.mjs"
compatibility_date = "2026-01-01"

# Counts are stored in a Durable Object (USAGE_DO) — atomic, SQLite-backed,
# and not subject to Workers KV's free-plan 1,000 writes/day limit. See
# worker/README.md for the full walkthrough (the old KV namespace is gone;
# there is no kv_namespaces entry anymore).
[[durable_objects.bindings]]
name = "USAGE_DO"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]
