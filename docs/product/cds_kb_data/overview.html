<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CDS Knowledge Base · Overview</title>
<style>
  :root {
    --surface-1: #1a1a19;
    --page-plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; white-space: nowrap; }
  h1 span { color: var(--text-secondary); font-weight: 400; }
  .tabs { display: flex; gap: 6px; align-items: center; }
  .tabs button {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--text-primary); background: var(--surface-1); border-color: var(--text-secondary); }
  .open-new { margin-left: auto; font-size: 12px; }
  .open-new a { color: var(--text-muted); text-decoration: none; margin-left: 12px; }
  .open-new a:hover { color: var(--text-secondary); text-decoration: underline; }
  .frame-wrap { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--page-plane); }
  iframe.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>CDS Knowledge Base · <span>Overview</span></h1>
  <div class="tabs" role="tablist">
    <button id="tab-btn-dashboard" role="tab" aria-selected="true">📊 Dashboard</button>
    <button id="tab-btn-coverage" role="tab" aria-selected="false">📡 Hub Coverage</button>
    <button id="tab-btn-search" role="tab" aria-selected="false">🔍 Search</button>
    <button id="tab-btn-fieldsearch" role="tab" aria-selected="false">🔎 Field/Table Search</button>
  </div>
  <div class="open-new">
    <a href="dashboard.html" target="_blank">open dashboard in new tab ↗</a>
    <a href="coverage-report.html" target="_blank">open coverage in new tab ↗</a>
    <a href="search.html" target="_blank">open search in new tab ↗</a>
    <a href="field-search.html" target="_blank">open field search in new tab ↗</a>
  </div>
</header>
<div class="frame-wrap">
  <iframe id="frame-dashboard" class="active" src="dashboard.html" title="Dashboard"></iframe>
  <iframe id="frame-coverage" src="coverage-report.html" title="Hub Coverage"></iframe>
  <iframe id="frame-search" src="search.html" title="Search"></iframe>
  <iframe id="frame-fieldsearch" src="field-search.html" title="Field/Table Search"></iframe>
</div>
<script>
  const buttons = { dashboard: document.getElementById('tab-btn-dashboard'), coverage: document.getElementById('tab-btn-coverage'), search: document.getElementById('tab-btn-search'), fieldsearch: document.getElementById('tab-btn-fieldsearch') };
  const frames = { dashboard: document.getElementById('frame-dashboard'), coverage: document.getElementById('frame-coverage'), search: document.getElementById('frame-search'), fieldsearch: document.getElementById('frame-fieldsearch') };
  function show(name) {
    for (const k of Object.keys(frames)) {
      frames[k].classList.toggle('active', k === name);
      buttons[k].setAttribute('aria-selected', String(k === name));
    }
  }
  buttons.dashboard.addEventListener('click', () => show('dashboard'));
  buttons.coverage.addEventListener('click', () => show('coverage'));
  buttons.search.addEventListener('click', () => show('search'));
  buttons.fieldsearch.addEventListener('click', () => show('fieldsearch'));
</script>
</body>
</html>
