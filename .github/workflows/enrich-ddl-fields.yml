# .github/workflows/enrich-ddl-fields.yml
# Backfill Type/Description onto Full-DDL views' Fields table from the Hub
# catalog's per-view field metadata (see scripts/enrich_ddl_fields.mjs) —
# DDL parsing alone never gives a field's data type, only the Hub catalog
# does. Purely additive: never touches DDL source, or the Key/Association/
# Via/Source columns already derived from it.
#
# Same PR-accumulation pattern as hub-metadata-fetch.yml, for the same
# reason: all runs push to the SAME branch and add to the SAME PR until
# it's merged, instead of opening a new competing PR every day.

name: Enrich DDL Fields from Hub

on:
  schedule:
    # Daily at 8:00 AM UTC (offset from hub-metadata-fetch.yml's 7:00 AM)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max views to process this run (0 = no limit)'
        type: string
        default: '50'
      dry_run:
        description: 'Dry run (preview only, no files written)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: enrich-ddl-fields
  cancel-in-progress: false

jobs:
  enrich-fields:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare working branch
        id: branch
        run: |
          git config user.name "cds-kb-bot"
          git config user.email "bot@cds-kb.local"

          BRANCH="enrich-ddl-fields/pending"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "ℹ️  Reusing existing pending branch (previous PR not merged yet)"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge "origin/${GITHUB_REF_NAME}" --no-edit -m "Merge $GITHUB_REF_NAME into $BRANCH"
          else
            echo "ℹ️  No pending branch — starting a fresh one"
            git checkout -b "$BRANCH"
          fi

      - name: Enrich Full-DDL views from the Hub catalog
        id: enrich
        run: |
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          ARGS=("--limit" "$LIMIT")

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi

          echo "🚀 Running: node scripts/enrich_ddl_fields.mjs ${ARGS[*]}"

          if node scripts/enrich_ddl_fields.mjs "${ARGS[@]}" 2>&1 | tee fetch_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild search index with enriched fields
        if: github.event.inputs.dry_run != 'true' && steps.enrich.outputs.status == 'success'
        run: npm run rebuild-index

      - name: Commit and open/update PR for review
        if: github.event.inputs.dry_run != 'true' && steps.enrich.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"

          if git diff --quiet HEAD -- views/ index/ ddl-field-enrichment-manifest.json; then
            echo "ℹ️  No fields enriched this run"
            exit 0
          fi

          git add views/ index/
          if [ -f ddl-field-enrichment-manifest.json ]; then
            git add ddl-field-enrichment-manifest.json
          fi
          if [ -f ddl-field-enrichment-request.json ]; then
            git add ddl-field-enrichment-request.json
          fi
          git commit -m "Enrich DDL fields from Hub catalog ($(date +'%Y-%m-%d'))"
          git push origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "✅ Added commit to existing PR: $BRANCH"
          else
            cat > pr_body.md <<'EOF'
          Backfills Type/Description onto Full-DDL views' Fields table from the
          SAP Business Accelerator Hub's public catalog (`--source hub-catalog`),
          matched onto already-parsed DDL fields by name.

          **Purely additive** — never touches DDL source, or the Key/Association/
          Via/Source columns already derived from it. A DDL field with no Hub
          match just keeps what it already had.

          This PR accumulates a small batch every day (see workflow comments for
          why) until merged — review whenever convenient, no rush.
          EOF

            gh pr create \
              --title "Enrich DDL fields from Hub catalog (ongoing)" \
              --base main \
              --head "$BRANCH" \
              --body-file pr_body.md

            echo "✅ PR opened: $BRANCH"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ DDL field enrichment failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The DDL field enrichment workflow failed.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation', 'bug'],
            });
