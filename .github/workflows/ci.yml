# .github/workflows/ci.yml
# Tests + data validation on every pull request (and on pushes to main that
# touch the data pipeline). daily-fetch.yml and hub-metadata-fetch.yml open
# PRs every day but previously merged them "blind" — nothing verified the
# generated view files. This runs:
#   - npm test: parser regression tests + the abaplint CDS DDL cross-check
#     (test/ddl-abaplint-crosscheck.test.mjs) over a deterministic sample of
#     the views on the branch.
#   - scripts/validate-views.mjs: frontmatter shape, name/filename agreement,
#     source_available consistency across every view file.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/product/cds_kb_data/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit + cross-check tests
        run: npm test

      - name: Validate view files
        run: node scripts/validate-views.mjs .
