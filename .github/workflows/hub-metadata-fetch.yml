# .github/workflows/hub-metadata-fetch.yml
# Fill in views that check-coverage.yml has confirmed are RELEASED on the SAP
# Business Accelerator Hub but missing from views/, using field metadata from
# the Hub's public catalog (no login required — works with zero auth today;
# see src/fetcher.mjs fetchFromHubCatalog / scripts/add_hub_metadata.mjs). An
# optional SAP_API_HUB_KEY repo secret is passed through below as a fallback
# in case that ever changes — nothing here depends on it being set.
#
# No raw DDL is available this way (the Hub doesn't expose it publicly at
# all — confirmed via its own OData $metadata), so entries are written as
# "metadata-only" (field name/type/length, no DDL source) and tagged
# release_state: released, since the Hub itself confirms RELEASED status —
# unlike daily-fetch.yml's GitHub search, this isn't a filename guess.
#
# Two things this workflow is deliberately careful about:
#   1. No duplicate PRs. All runs push to the SAME branch
#      (hub-metadata-fetch/pending) and add to the SAME PR until it's
#      merged, instead of opening a new competing PR every day. The fetch
#      step runs against that branch's state (not a fresh main checkout),
#      so it never re-fetches a view that's already sitting in the open PR.
#   2. Small, slow batches. Default --limit 50 with low concurrency and a
#      delay between requests — this hits a public, unauthenticated SAP
#      endpoint with no published rate limit, so staying gentle matters
#      more than finishing fast.
#   3. Don't commit index/ or dashboard.html here. Both are fully
#      regenerated by resync-folders.yml / update-dashboard.yml on main
#      once this branch merges, and this branch lives for days — an
#      independently regenerated copy on each side guaranteed a merge
#      conflict the moment main's copy moved on (hit this for real:
#      dashboard.html and index/*.json both conflicted on the same day).

name: Hub Metadata Fetch

on:
  schedule:
    # Daily at 7:00 AM UTC (offset from daily-fetch.yml's 6:00 AM)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max views to process this run (0 = no limit)'
        type: string
        default: '100'
      dry_run:
        description: 'Dry run (preview only, no files written)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: hub-metadata-fetch
  cancel-in-progress: false

jobs:
  fetch-metadata:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The CDS KB project lives under this subpath now — see
        # check-coverage.yml's comment for the full rationale.
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare working branch
        id: branch
        env:
          # Needed to check for an open PR (not just branch existence) below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "cds-kb-bot"
          git config user.email "bot@cds-kb.local"

          BRANCH="hub-metadata-fetch/pending"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # Reuse the branch only if it has an OPEN PR. `gh pr view "$BRANCH"`
          # matches merged/closed PRs too, so branch-existence alone isn't a
          # safe signal — once a PR merges, the branch lingers and looks
          # "pending" forever. That let two days of fetch commits (2026-08-08,
          # 2026-08-09) get silently skipped for PR creation, then merging
          # main into the stale branch on 2026-08-10 hit a changelog.json
          # conflict (recovered manually in PR #9).
          OPEN_PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')

          if [ "$OPEN_PR_COUNT" -gt 0 ]; then
            echo "ℹ️  Reusing existing pending branch (open PR found)"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge "origin/${GITHUB_REF_NAME}" --no-edit -m "Merge $GITHUB_REF_NAME into $BRANCH"
          else
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "⚠️  Pending branch exists but has no open PR (already merged/closed) — resetting it from ${GITHUB_REF_NAME}"
            else
              echo "ℹ️  No pending branch — starting a fresh one"
            fi
            git checkout -b "$BRANCH"
          fi

      - name: Fetch missing views from the Hub catalog
        id: fetch
        env:
          # Optional — this endpoint already works unauthenticated (see
          # src/fetcher.mjs fetchFromHubCatalog). Only takes effect if this
          # repo has a SAP_API_HUB_KEY secret configured.
          SAP_API_HUB_KEY: ${{ secrets.SAP_API_HUB_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          ARGS=("--limit" "$LIMIT")

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi

          echo "🚀 Running: node scripts/add_hub_metadata.mjs ${ARGS[*]}"

          if node scripts/add_hub_metadata.mjs "${ARGS[@]}" 2>&1 | tee fetch_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Commit and open/update PR for review
        if: github.event.inputs.dry_run != 'true' && steps.fetch.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"

          if git diff --quiet HEAD -- views/ changelog.json hub-metadata-manifest.json hub-metadata-refresh-request.json; then
            echo "ℹ️  No new views this run"
            exit 0
          fi

          git add views/ changelog.json
          if [ -f hub-metadata-manifest.json ]; then
            git add hub-metadata-manifest.json
          fi
          if [ -f hub-metadata-refresh-request.json ]; then
            git add hub-metadata-refresh-request.json
          fi
          git commit -m "Hub metadata fetch ($(date +'%Y-%m-%d'))"
          # Force-push: the branch above may have just been reset from main
          # (no open PR referencing the old tip), which is a non-fast-forward
          # from the remote's perspective. Safe here — this branch is only
          # ever written by this workflow.
          git push --force origin "$BRANCH"

          OPEN_PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PR_COUNT" -gt 0 ]; then
            echo "✅ Added commit to existing PR: $BRANCH"
          else
            cat > pr_body.md <<'EOF'
          Automated fill-in from the SAP Business Accelerator Hub's public catalog
          (`--source hub-catalog`) for views confirmed `State: RELEASED` there but
          missing locally (see coverage-report.html).

          **No DDL source in these entries** — the Hub doesn't expose raw DDL
          publicly (confirmed via its OData `$metadata`: the CDSVIEW entity has no
          such property). Each entry has field name/type/length, app component,
          and business context instead, tagged `metadata-only`.
          `release_state: released` reflects the Hub's own confirmation, not a guess.

          This PR accumulates a small batch every day (see workflow comments for
          why) until merged — review whenever convenient, no rush.
          EOF

            gh pr create \
              --title "Hub metadata fetch (ongoing)" \
              --base main \
              --head "$BRANCH" \
              --body-file pr_body.md

            echo "✅ PR opened: $BRANCH"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Hub metadata fetch failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The Hub metadata fetch workflow failed.\n\nSee: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['automation', 'bug'],
            });
