# .github/workflows/resync-folders.yml
# Keep views/<MODULE>/ in sync whenever a view's app_component or
# release_state changes — e.g. someone hand-edits app_component to fix a
# wrong value, or a merged PR added a view somewhere migrate-to-module-
# folders.mjs wouldn't have picked.
#
# migrate-to-module-folders.mjs is a no-op when nothing's misplaced, so this
# is cheap to run on every views/** push. Its own commit is tagged
# [skip ci] specifically because it touches views/** itself — without that,
# it would retrigger this same workflow forever.

name: Resync View Folders

on:
  push:
    branches: [main]
    paths:
      - 'docs/product/cds_kb_data/views/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: resync-folders
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The CDS KB project lives under this subpath now — see
        # check-coverage.yml's comment for the full rationale.
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resync folders + rebuild index
        run: npm run resync-folders

      - name: Commit and push if changed
        uses: ./.github/actions/commit-and-push
        with:
          paths: docs/product/cds_kb_data/views/ docs/product/cds_kb_data/index/
          commit-message: "Resync view folders [skip ci]"
          empty-message: Nothing to resync
          success-message: Folders resynced
